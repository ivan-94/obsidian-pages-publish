<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PROTOTYPE — Narrow viewport harness</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: start center; padding: 24px; background: #242424; }
      iframe { width: 390px; height: 844px; border: 6px solid #fff; background: #fff; box-shadow: 12px 12px 0 #ff4b17; }
    </style>
  </head>
  <body>
    <iframe title="390px theme prototype"></iframe>
    <script>
      const variant = new URLSearchParams(location.search).get('variant') ?? 'A'
      document.querySelector('iframe').src = `/?variant=${encodeURIComponent(variant)}`
    </script>
  </body>
</html>
